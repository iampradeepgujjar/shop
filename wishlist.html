<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist – TechNexus</title>
  <meta name="description" content="Your saved products on TechNexus." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header scrolled" id="site-header">
    <div class="header-top"><div class="container"><span>❤️ Your saved items</span></div></div>
    <nav class="navbar container">
      <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span class="logo-text">Tech<span class="accent">Nexus</span></span></a>
      <div class="nav-search">
        <input type="search" id="nav-search-input" placeholder="Search products…" />
        <button id="nav-search-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="repair.html">Repair</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-icon-btn active" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="badge" id="wishlist-count">0</span>
        </button>
        <button class="nav-icon-btn cart-btn" onclick="window.location='cart.html'" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="badge" id="cart-count">0</span>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      </div>
    </nav>
  </header>

  <section class="page-hero">
    <h1>My Wishlist</h1>
    <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></div>
  </section>

  <main class="container section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <h2 style="font-size:1.2rem;color:var(--clr-white);" id="wishlist-heading">Saved Items</h2>
      <div style="display:flex;gap:0.75rem;">
        <button class="btn btn-outline btn-sm" onclick="addAllToCart()">Add All to Cart</button>
        <button class="btn btn-ghost btn-sm" onclick="clearWishlist()">Clear Wishlist</button>
      </div>
    </div>
    <div class="products-grid" id="wishlist-grid"></div>
    <div class="empty-state" id="wishlist-empty" style="display:none;">
      <div class="empty-icon">❤️</div>
      <h3>Your wishlist is empty</h3>
      <p>Browse products and click the heart icon to save items you love.</p>
      <a href="products.html" class="btn btn-primary">Browse Products</a>
    </div>
  </main>

  <footer class="site-footer"><div class="footer-bottom container"><p>© 2026 TechNexus. All rights reserved.</p></div></footer>

  <div class="toast-container" id="toast-container"></div>
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Cart.init();
      renderWishlist();
    });

    function renderWishlist() {
      const ids  = Cart.getWishlist();
      const grid = document.getElementById('wishlist-grid');
      const empty = document.getElementById('wishlist-empty');
      const heading = document.getElementById('wishlist-heading');

      if (ids.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'flex';
        heading.textContent = 'Saved Items (0)';
        return;
      }
      empty.style.display = 'none';
      heading.textContent = `Saved Items (${ids.length})`;
      const items = ids.map(id => getProductById(id)).filter(Boolean);
      grid.innerHTML = items.map(buildProductCard).join('');
    }

    function addAllToCart() {
      const ids = Cart.getWishlist();
      ids.forEach(id => Cart.addToCart(id, 1));
      showToast(`Added ${ids.length} items to cart!`, 'success');
    }

    function clearWishlist() {
      if (!confirm('Remove all items from wishlist?')) return;
      Cart.getWishlist().forEach(id => Cart.toggleWishlist(id));
      renderWishlist();
    }
  </script>
</body>
</html>
