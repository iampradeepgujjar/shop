<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="meta-title">Product – TechNexus</title>
  <meta name="description" id="meta-desc" content="View product details on TechNexus – India's premier computer parts store." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/product-detail.css" />
</head>
<body>

  <header class="site-header scrolled" id="site-header">
    <div class="header-top"><div class="container"><span>🚀 Free Shipping on orders above ₹2,999</span></div></div>
    <nav class="navbar container">
      <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span class="logo-text">Tech<span class="accent">Nexus</span></span></a>
      <div class="nav-search">
        <input type="search" id="nav-search-input" placeholder="Search products…" />
        <button id="nav-search-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="repair.html">Repair</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-icon-btn" onclick="window.location='wishlist.html'" aria-label="Wishlist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="badge" id="wishlist-count">0</span>
        </button>
        <button class="nav-icon-btn cart-btn" onclick="window.location='cart.html'" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="badge" id="cart-count">0</span>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      </div>
    </nav>
  </header>

  <div class="breadcrumb container" style="padding:1rem var(--spacing-xl);" id="product-breadcrumb">
    <a href="index.html">Home</a><span>/</span>
    <a href="products.html">Products</a><span>/</span>
    <span id="bc-name">Product</span>
  </div>

  <main id="product-detail-main" class="container product-detail-layout">
    <!-- Filled by JS -->
    <div class="product-detail-loading">
      <div class="loading-spinner"></div>
      <p>Loading product…</p>
    </div>
  </main>

  <!-- Related Products -->
  <section class="section container" id="related-section">
    <div class="section-header" style="text-align:left;">
      <span class="section-tag">More Like This</span>
      <h2 class="section-title">Related Products</h2>
    </div>
    <div class="products-grid" id="related-products"></div>
  </section>

  <footer class="site-footer"><div class="footer-bottom container"><p>© 2026 TechNexus. All rights reserved.</p><div class="payment-icons"><span class="pay-badge">Paytm</span><span class="pay-badge">UPI</span><span class="pay-badge">Visa</span><span class="pay-badge">Mastercard</span></div></div></footer>

  <div class="toast-container" id="toast-container"></div>
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
